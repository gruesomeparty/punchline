<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>punchline preview</title>
    <link rel="stylesheet" href="../ui/page.css" />
    <script type="module" src="days.js"></script>
  </head>
  <body>
    <main>
      <h1>Preview</h1>
      <form id="range" class="row">
        <div>
          <label for="from">From</label>
          <input id="from" type="date" required />
        </div>
        <div>
          <label for="to">To</label>
          <input id="to" type="date" required />
        </div>
        <button type="submit">Load preview</button>
      </form>
      <p class="hint">
        Read only. Loads your Harvest hours and, if HRworks Arbeitszeiten is open in a tab,
        compares them with what HRworks already has. The HRworks tab will switch months and open
        weeks while it reads. Nothing is written to HRworks yet.
      </p>
      <div id="status" class="status" role="status"></div>
      <table id="days" hidden>
        <thead>
          <tr>
            <th>Day</th>
            <th>Harvest</th>
            <th>HRworks now</th>
            <th>Enter</th>
            <th>Break</th>
            <th>Action</th>
            <th>Note</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>
  </body>
</html>
