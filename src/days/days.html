<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>punchline preview</title>
    <link rel="stylesheet" href="../ui/page.css" />
    <script type="module" src="days.js"></script>
  </head>
  <body>
    <main>
      <h1>Preview</h1>
      <form id="range" class="row">
        <div>
          <label for="from">From</label>
          <input id="from" type="date" required />
        </div>
        <div>
          <label for="to">To</label>
          <input id="to" type="date" required />
        </div>
        <button type="submit">Load preview</button>
      </form>
      <p class="row presets">
        <button type="button" class="secondary" data-preset="this-week">This week</button>
        <button type="button" class="secondary" data-preset="last-week">Last week</button>
        <button type="button" class="secondary" data-preset="this-month">This month</button>
        <button type="button" class="secondary" data-preset="last-month">Last month</button>
      </p>
      <p class="hint">Keep HRworks Arbeitszeiten open, and don't touch it while punchline works.</p>
      <div id="status" class="status" role="status"></div>
      <button id="write-all" type="button" class="write" hidden>Write all</button>
      <table id="days" hidden>
        <thead>
          <tr>
            <th>Day</th>
            <th>Harvest</th>
            <th>HRworks now</th>
            <th>Enter</th>
            <th class="col-break">Break</th>
            <th>Action</th>
            <th>Note</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <details id="debug" hidden>
        <summary>Debug log of the last run in HRworks</summary>
        <button id="debug-copy" type="button" class="secondary">Copy</button>
        <pre id="debug-text"></pre>
      </details>
    </main>
  </body>
</html>
