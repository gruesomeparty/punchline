name: PR title

# PRs are squash-merged with the title as the commit title, so the title must be a
# Conventional Commit. "edited" re-runs the check when only the title changes.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-commit:
    name: Conventional Commit title
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # The title is untrusted input: pass it through env, never interpolate it into the script.
      - run: node scripts/check-pr-title.ts
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
